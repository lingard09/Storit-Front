<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>스토릿 - 교환 완료</title>
    <link rel="stylesheet" href="assets/base.css" />
    <link rel="stylesheet" href="assets/complete.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="frame cp-page">
      <!-- 헤더 -->
      <header class="cp-header">
        <button
          type="button"
          class="cp-back"
          aria-label="뒤로 가기"
          onclick="history.back()"
        ></button>
        <h1 class="cp-title">교환 완료</h1>
      </header>

      <div class="cp-scroll">
        <!-- 완료 일러스트 (컨페티 배경 + 마스코트) -->
        <div class="cp-illust-wrap">
          <img class="cp-confetti" src="assets/exp_bg.svg" alt="" aria-hidden="true" />
          <img class="cp-illust" src="assets/Vector(38).svg" alt="" aria-hidden="true" />
        </div>

        <!-- 안내 문구 -->
        <div class="cp-head">
          <p class="cp-head-title">교환 신청이 완료되었어요!</p>
          <p class="cp-head-sub">신청한 상품은 아래 내용으로 지급될 예정이에요.</p>
        </div>

        <!-- 교환 상세 -->
        <div class="cp-detail">
          <div class="cp-row">
            <span class="cp-row-label">상품명</span>
            <span class="cp-row-val">네이버페이 포인트 5,000원</span>
          </div>
          <div class="cp-row">
            <span class="cp-row-label">사용쿠키</span>
            <span class="cp-row-val">50 개</span>
          </div>
          <div class="cp-row">
            <span class="cp-row-label">교환일시</span>
            <span class="cp-row-val">2026.05.21 14:30</span>
          </div>
        </div>

        <!-- 현재 보유 쿠키 -->
        <div class="cp-balance">
          <div class="cp-balance-col">
            <span class="cp-balance-label">현재 보유 쿠키</span>
            <span class="cp-balance-val">
              <img src="assets/shop_cookie.svg" alt="" /><b>30</b><small>개</small>
            </span>
          </div>
          <span class="cp-balance-div"></span>
          <button type="button" class="cp-history">
            쿠키 내역 보러가기<span class="cp-history-arrow"></span>
          </button>
        </div>
      </div>

      <!-- 하단 CTA -->
      <div class="cp-submit-wrap">
        <button type="button" class="cp-submit cp-submit--primary">
          보관함에서 확인하기
        </button>
        <button
          type="button"
          class="cp-submit cp-submit--ghost"
          onclick="location.href='shop.html'"
        >
          상점으로 돌아가기
        </button>
      </div>

      <!-- 하단 스캘럽 장식 -->
      <div class="cp-scallop" aria-hidden="true">
        <span></span><span></span><span></span><span></span><span></span
        ><span></span>
      </div>
    </div>
  </body>
</html>
