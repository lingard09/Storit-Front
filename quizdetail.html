<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>스토릿 - 퀴즈 상세</title>
    <link rel="stylesheet" href="assets/base.css" />
    <link rel="stylesheet" href="assets/quizdetail.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="frame qd-page">
      <!-- 헤더 -->
      <header class="qd-header">
        <button
          type="button"
          class="qd-back"
          aria-label="뒤로 가기"
          onclick="location.href='myquiz.html'"
        ></button>
        <h1 class="qd-title">내 웹툰 퀴즈</h1>
      </header>

      <div class="qd-scroll">
        <!-- 퀴즈 요약 -->
        <div class="qd-card qd-quiz">
          <img
            class="qd-quiz-thumb"
            src="assets/webtoon_ai_doctor.png"
            alt=""
          />
          <div class="qd-quiz-info">
            <b class="qd-quiz-title">AI. 닥터 8화</b>
            <span class="qd-quiz-date">등록일 2026.05.24</span>
            <span class="qd-badge is-approved">승인완료</span>
          </div>
        </div>

        <!-- 유저 참여 현황 (승인 상태에서만) -->
        <div class="qd-card qd-approved-only">
          <h2 class="qd-card-title">유저 참여 현황</h2>
          <div class="qd-stats">
            <div class="qd-stat">
              <img class="qd-stat-ico" src="assets/streamline-kameleon-color_play-duo.svg" alt="" />
              <span class="qd-stat-k">총 플레이 수</span>
              <b class="qd-stat-v">1,248 회</b>
              <span class="qd-stat-sub qd-delta-sub">어제 대비 <i class="qd-delta is-up"></i>18</span>
            </div>
            <div class="qd-stat">
              <img class="qd-stat-ico" src="assets/glyphs-poly_target-pointer.svg" alt="" />
              <span class="qd-stat-k">평균 정답률</span>
              <b class="qd-stat-v">38%</b>
              <span class="qd-stat-sub">상위 23%</span>
            </div>
            <div class="qd-stat">
              <img class="qd-stat-ico" src="assets/emojione-v1_alarm-clock.svg" alt="" />
              <span class="qd-stat-k">평균 풀이 시간</span>
              <b class="qd-stat-v">6.2 초</b>
              <span class="qd-stat-sub">상위 41%</span>
            </div>
          </div>
        </div>

        <!-- 내 퀴즈 평가 (승인 상태에서만) -->
        <div class="qd-card qd-approved-only">
          <h2 class="qd-card-title">내 퀴즈 평가</h2>
          <div class="qd-eval">
            <div class="qd-eval-btn">
              <img src="assets/heroicons_face-smile-solid.svg" alt="" />좋아요
            </div>
            <div class="qd-eval-btn">
              <img src="assets/reaction_easy.svg" alt="" />쉬워요
            </div>
            <div class="qd-eval-btn">
              <img src="assets/iconamoon_expressionless-face-fill.svg" alt="" />어려워요
            </div>
          </div>
          <div class="qd-eval-counts">
            <span>7 개</span>
            <span>15 개</span>
            <span>23 개</span>
          </div>
        </div>

        <!-- 퀴즈 질문 & 정답/오답 -->
        <div class="qd-card">
          <h2 class="qd-card-title">퀴즈 질문</h2>
          <div class="qd-question">
            예: 무케가 왕이 되겠다고 결심하게 된 이유는?
          </div>

          <h2 class="qd-card-title qd-mt">퀴즈 정답 &amp; 오답</h2>
          <div class="qd-answers">
            <div class="qd-answer">
              <span class="qd-ox qd-ox--o"><img src="assets/glyphs-poly_circle.svg" alt="정답" /></span>
              <div class="qd-answer-box">정답 작성하기</div>
            </div>
            <div class="qd-answer">
              <span class="qd-ox qd-ox--x"><img src="assets/dashicons_no.svg" alt="오답" /></span>
              <div class="qd-answer-box">오답 작성하기</div>
            </div>
            <div class="qd-answer">
              <span class="qd-ox qd-ox--x"><img src="assets/dashicons_no.svg" alt="오답" /></span>
              <div class="qd-answer-box">오답 작성하기</div>
            </div>
            <div class="qd-answer">
              <span class="qd-ox qd-ox--x"><img src="assets/dashicons_no.svg" alt="오답" /></span>
              <div class="qd-answer-box">오답 작성하기</div>
            </div>
          </div>
        </div>

        <!-- 반려 사유 (반려 상태에서만) -->
        <div class="qd-reject qd-rejected-only" hidden>
          <div class="qd-reject-head">
            <img src="assets/streamline-ultimate-color_stop-sign.svg" alt="" />
            <b>반려 사유</b>
          </div>
          <span class="qd-reject-reason">정답이 맞지 않음</span>
        </div>
      </div>

      <!-- 돌아가기 -->
      <div class="qd-bar">
        <button
          type="button"
          class="qd-btn"
          onclick="location.href='myquiz.html'"
        >
          돌아가기
        </button>
      </div>
    </div>

    <script src="assets/quizdetail.js"></script>
  </body>
</html>
