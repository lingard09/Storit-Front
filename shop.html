<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>스토릿 - 상점</title>
    <link rel="stylesheet" href="assets/base.css" />
    <link rel="stylesheet" href="assets/shop.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="frame sh-page">
      <!-- 헤더 -->
      <header class="sh-header">
        <button
          type="button"
          class="sh-back"
          aria-label="뒤로 가기"
          onclick="history.back()"
        ></button>
        <h1 class="sh-title">상점</h1>
      </header>

      <div class="sh-scroll">
        <!-- 쿠키 교환 배너 -->
        <section class="sh-banner">
          <div class="sh-banner-top">
            <img class="sh-banner-bg" src="assets/shop_banner_bg.png" alt="" aria-hidden="true" />
            <span class="sh-banner-badge">쿠키 1개 = 100원</span>
            <h2 class="sh-banner-title">모은 쿠키를<br />원하는 기프티콘으로!</h2>
            <p class="sh-banner-desc">
              열심히 모은 쿠키로 다양한 상품권을 교환해 보세요!
            </p>
            <img class="sh-banner-illust" src="assets/shop_banner_illust.svg" alt="" aria-hidden="true" />
          </div>
          <div class="sh-banner-foot">
            <div class="sh-mycookie">
              지금까지 모은 내 쿠키
              <img class="sh-mycookie-arrow" src="assets/icon_next.svg" alt="" />
              <span class="sh-mycookie-count">
                <img class="sh-cookie-ico" src="assets/shop_cookie.svg" alt="" />
                <b class="sh-mycookie-num">80개</b>
              </span>
            </div>
            <button type="button" class="sh-storage" onclick="location.href='storage.html'">보관함</button>
          </div>
        </section>

        <!-- 카테고리 (shop.js 가 채움) -->
        <nav class="sh-cats"></nav>

        <!-- 추천상품 -->
        <section class="sh-sec">
          <h3 class="sh-sec-title">추천상품</h3>
          <div class="sh-reco-wrap">
            <div class="sh-reco"></div>
            <button type="button" class="sh-more" aria-label="더보기"></button>
          </div>
        </section>

        <!-- 전체상품 -->
        <section class="sh-sec">
          <h3 class="sh-sec-title">전체상품</h3>
          <div class="sh-sec-sub">
            <span class="sh-count">상품 <b>1357</b>개</span>
            <button type="button" class="sh-sort">인기순 <span class="sh-sort-caret"></span></button>
          </div>
          <div class="sh-grid"></div>
        </section>

        <!-- 하단 광고 -->
        <aside class="sh-ad">
          <div class="sh-ad-text">
            <span class="sh-ad-sub">웹툰만 보면</span>
            <strong class="sh-ad-title">아이패드가 공짜!</strong>
            <span class="sh-ad-sub">매주 추첨을 통해 아이패드를 드려요!</span>
          </div>
          <img class="sh-ad-ipad" src="assets/ad_ipad.png" alt="" aria-hidden="true" />
          <button type="button" class="sh-ad-cta">
            이벤트 참여하러가기<span class="sh-ad-arrow"></span>
          </button>
        </aside>
      </div>

      <!-- 하단 네비게이션 -->
      <nav class="mn-nav">
        <div class="mn-nav-items">
          <button type="button" class="mn-nav-item mn-nav-item--home" onclick="location.href='main.html'">
            <span class="mn-nav-icon"></span>
            홈
          </button>
          <button type="button" class="mn-nav-item mn-nav-item--ranking">
            <span class="mn-nav-icon"></span>
            랭킹
          </button>
          <button type="button" class="mn-nav-item mn-nav-item--shop is-active">
            <span class="mn-nav-icon"></span>
            상점
          </button>
          <button type="button" class="mn-nav-item mn-nav-item--profile">
            <span class="mn-nav-icon"></span>
            마이페이지
          </button>
        </div>

        <span class="mn-nav-indicator"></span>
      </nav>
    </div>

    <script src="assets/shop.js"></script>
  </body>
</html>
