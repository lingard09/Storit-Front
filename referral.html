        <div class="rf-card">
          <label class="rf-label" for="rf-input">초대코드 (선택 입력)</label>

          <div class="rf-field">
            <span class="rf-field-icon"><svg class="rf-mark" aria-hidden="true" width="22" height="22" viewBox="0 0 22 22" fill="none" xmlns="http://www.w3.org/2000/svg">

            <input
              id="rf-input"
              class="rf-input"
              type="text"
              inputmode="latin"
              autocomplete="off"
              autocapitalize="characters"
              spellcheck="false"
              maxlength="16"
              placeholder="초대코드 입력하기"
            />
            <button type="button" class="rf-apply" disabled>적용</button>
          </div>

          <p class="rf-help">
            초대코드가 없어도 괜찮아요. 바로 다음 단계로 넘어갈 수 있어요.
          </p>

          <p class="rf-msg" role="status" aria-live="polite"></p>
        </div>
      </div>

      <img class="rf-scallop" src="assets/scallop_bottom.svg" alt="" />

      <button
        type="button"
        class="sheet-cta sheet-cta--brown"
        data-next="userinfo.html"
      >
        다음
      </button>
    </div>

    <script src="assets/referral.js"></script>

</html>
