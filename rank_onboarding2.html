<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>스토릿 - 랭킹 안내</title>
    <link rel="stylesheet" href="assets/base.css" />
    <link rel="stylesheet" href="assets/onboarding.css" />
    <link rel="stylesheet" href="assets/rank_ob.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="assets/frame-scale.js"></script>
  </head>
  <body>
    <div class="frame onboarding rank-ob rank-ob2" data-next="ranking.html">
      <img class="ob-bg ob-bg--p2" src="assets/ranking_bg.png" alt="" />

      <p class="r2-note">동점자는 퀴즈 풀이 시간에 따라 순위를 구분합니다</p>
      <h1 class="r2-title">어제의 일간순위를<br />발표합니다!</h1>

      <div class="r2-cards">
        <!-- 1위 -->
        <div class="r2-col">
          <div class="r2-card r2-card--gold">
            <img class="r2-medal" src="assets/rank_medal1.svg" alt="" />
            <span class="r2-rank">1위</span>
            <img class="r2-avatar" src="assets/rank_avatar.svg" alt="" />
            <span class="r2-name">무케대마왕</span>
            <span class="r2-score">
              <img src="assets/rank_star.svg" alt="" /><b>9,990</b>
            </span>
          </div>
          <div class="r2-reward">
            <img src="assets/rank_cookie.svg" alt="" /><b>50</b>
          </div>
        </div>

        <!-- 27위 -->
        <div class="r2-col">
          <div class="r2-card r2-card--green">
            <img class="r2-medal" src="assets/rank_medal2.svg" alt="" />
            <span class="r2-rank">27위</span>
            <img class="r2-avatar" src="assets/rank_avatar.svg" alt="" />
            <span class="r2-name">웹툰도하</span>
            <span class="r2-score">
              <img src="assets/rank_star.svg" alt="" /><b>5,680</b>
            </span>
          </div>
          <div class="r2-reward">
            <img src="assets/rank_cookie.svg" alt="" /><b>20</b>
          </div>
        </div>
      </div>

      <img class="r2-hero" src="assets/ranking_hero.svg" alt="랭킹 일러스트" />
    </div>

    <script src="assets/rank_ob.js"></script>
  </body>
</html>
