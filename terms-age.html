<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>스토릿 - 14세 이상 이용약관</title>
    <link rel="stylesheet" href="assets/base.css" />
    <link rel="stylesheet" href="assets/sheet.css" />
    <link rel="stylesheet" href="assets/terms.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap"
      rel="stylesheet"
    />
    <script src="assets/frame-scale.js"></script>
  </head>
  <body>
    <div class="frame terms-page">
      <div class="terms-sheet">
        <div class="terms-header">
          <button
            type="button"
            class="terms-back"
            aria-label="뒤로 가기"
            onclick="location.href='terms.html'"
          ></button>
          <h1 class="terms-header-title">14세 이상 이용약관</h1>
        </div>

        <div class="terms-doc">
          <div class="terms-doc-card">
            <section>
              <p>
                스토릿(Storit)은 관련 법령에 의거하여 만 14세 미만 아동의
                개인정보 보호를 위해 회원가입을 제한하고 있습니다.
              </p>
            </section>

            <section>
              <p>
                본 서비스는 만 14세 이상인 이용자만 가입 및 이용이 가능합니다.
                가입 신청자는 본인의 연령이 만 14세 이상임을 확인하며, 이에
                동의합니다. 만약 만 14세 미만의 아동이 타인의 명의를 도용하는 등
                허위로 가입한 사실이 확인될 경우, 회사는 사전 통보 없이 서비스
                이용 제한 및 회원 탈퇴 조치를 취할 수 있습니다.
              </p>
            </section>
          </div>
        </div>
      </div>

      <button type="button" class="terms-cta is-active" onclick="location.href='terms.html'">
        확인 완료
      </button>
    </div>
  </body>
</html>
